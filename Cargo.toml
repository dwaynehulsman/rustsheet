[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "tools/icon"]
default-members = ["crates/core", "crates/app", "tools/icon"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Dwayne Hulsman <9630519+dwaynehulsman@users.noreply.github.com>"]

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
