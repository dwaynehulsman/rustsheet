[workspace]
resolver = "3"
members = ["crates/core"]
default-members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Dwayne Hulsman <dhulsman@infodatek.com>"]

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
