[package]
name = "rustsheet"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Native macOS-spreadsheet in Rust"

[dependencies]
arboard = "3.7.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "system_fonts", "wgpu"] }
egui = { version = "0.37.0", default-features = false }
muda = "0.21.2"
png = "0.18.1"
rfd = "0.17.2"
rustsheet-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
winit = { version = "0.30.13", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.37.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSURL", "NSString", "NSObject", "NSEnumerator"] }
